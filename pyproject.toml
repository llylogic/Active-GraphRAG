[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-graphrag"
version = "0.1.0"
description = "Active graph memory for multi-hop question answering"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "networkx>=3,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
models = ["torch>=2.2", "transformers>=4.45,<5", "sentence-transformers>=3,<6", "faiss-cpu>=1.8", "accelerate>=0.30"]
experiments = ["scikit-learn>=1.3", "matplotlib>=3.8"]
test = ["pytest>=8"]

[project.scripts]
active-graphrag = "active_graphrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
